<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Md. Mahtab Uddin - Full Stack and Shopify Developer a passion for creating intuitive and dynamic user interfaces. Connect with me on LinkedIn and GitHub." />
  <meta name="author" content="Md. Mahtab Uddin" />

  <!-- Open Graph Metadata -->
  <meta property="og:title" content="Md. Mahtab Uddin - Frontend Developer" />
  <meta property="og:description" content="Frontend Developer specializing in dynamic user interfaces. Explore my work on LinkedIn and GitHub." />
  <meta property="og:url" content="https://www.linkedin.com/in/md-mahtab-uddin-3a366b326/" />

  <!-- LinkedIn and GitHub -->
  <link rel="me" href="https://www.linkedin.com/in/md-mahtab-uddin-3a366b326/" />
  <link rel="me" href="https://github.com/Mabu-1" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/W0s3Zq9/pngtree-m-green-text-3d-a-to-z-png-image-3042020.png" />

  <title>Mahtab</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2B2B3E;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    #loading-screen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2B2B3E 0%, #1E1E2C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
      overflow: hidden;
    }
    
    /* Animated background elements */
    .loading-bg-element {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      background: #65a30d;
      animation: float 15s infinite linear;
    }
    
    .loading-bg-element:nth-child(1) {
      width: 150px;
      height: 150px;
      top: 10%;
      left: 20%;
      animation-delay: 0s;
      animation-duration: 25s;
    }
    
    .loading-bg-element:nth-child(2) {
      width: 100px;
      height: 100px;
      top: 60%;
      left: 70%;
      animation-delay: -5s;
      animation-duration: 20s;
    }
    
    .loading-bg-element:nth-child(3) {
      width: 200px;
      height: 200px;
      top: 30%;
      left: 60%;
      animation-delay: -10s;
      animation-duration: 30s;
    }
    
    @keyframes float {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      50% {
        transform: translate(20px, 30px) rotate(180deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }
    
    #welcome-container {
      position: relative;
      text-align: center;
      z-index: 2;
    }
    
    #welcome-text {
      font-size: 2.5rem;
      color: #65a30d;
      white-space: nowrap;
      overflow: hidden;
      margin: 0 auto;
      letter-spacing: 0.15em;
      animation: typing 1.5s steps(9, end) forwards, blink-caret 0.5s step-end infinite;
      text-shadow: 0 0 10px rgba(101, 163, 13, 0.5);
      font-weight: 300;
    }
    
    .welcome-subtitle {
      color: rgba(255, 255, 255, 0.7);
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.8s forwards;
      font-size: 1.2rem;
    }
    
    .progress-bar {
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, #65a30d, #a3e635);
      margin: 30px 0px 20px 0px;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(101, 163, 13, 0.5);
      animation: progress 2s ease-in-out 0.5s forwards;
    }
    
    @keyframes progress {
      0% { width: 0; }
      100% { width: min(100%, 700px); }
    }
    
    @keyframes typing {
      from { width: 0 }
      to { width: 9.5ch }
    }
    
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: #65a30d; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .hidden {
      display: none;
    }

    /* Responsive Styles */
    @media (min-width: 640px) {
      #welcome-text {
        font-size: 3.5rem;
      }
    }
    @media (min-width: 768px) {
      #welcome-text {
        font-size: 4.5rem;
      }
    }
    @media (min-width: 1024px) {
      #welcome-text {
        font-size: 5.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-bg-element"></div>
    <div class="loading-bg-element"></div>
    <div class="loading-bg-element"></div>
    
    <div id="welcome-container">
      <div id="welcome-text">Welcome</div>
      <div class="welcome-subtitle">Full Stack & Shopify Developer</div>
      <div class="progress-bar"></div>
    </div>
  </div>
  
  <!-- Main App Root -->
  <div id="root" class="hidden"></div>

  <!-- JavaScript to handle the transition -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loadingScreen = document.getElementById('loading-screen');
      const root = document.getElementById('root');
      const welcomeText = document.getElementById('welcome-text');

      // Function to fade out loading screen and show main content
      function transitionToMainContent() {
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.display = 'none';
          root.classList.remove('hidden');
        }, 800); // Match this with the transition time in CSS
      }

      // Wait for the typing animation to complete
      welcomeText.addEventListener('animationend', function(e) {
        if (e.animationName === 'typing') {
          setTimeout(transitionToMainContent, 1200); // Short pause after typing finishes
        }
      });
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
